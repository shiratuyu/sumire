<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>公演詳細</title>

    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/revue_detail.css">

</head>

<body>


<header class="top-heading">

    <a href="index.html" class="home-icon">
        <img class="home-img">
    </a>

</header>


<main>

    <!-- タイトル -->

    <section id="titleArea"></section>


    <!-- 基本情報 -->

    <section class="detailSection">

        <h2>基本情報</h2>

        <div class="detailGrid">

            <div class="detailLabel">組</div>
            <div id="revueTrp"></div>

            <div class="detailLabel">公演期間</div>
            <div id="revueSchedule"></div>

            <div class="detailLabel">主演</div>
            <div id="revueHero"></div>

            <div class="detailLabel">ヒロイン</div>
            <div id="revueHeroine"></div>

            <div class="detailLabel">新公主演</div>
            <div id="revueNewHero"></div>

            <div class="detailLabel">新公ヒロイン</div>
            <div id="revueNewHeroine"></div>

            <div class="detailLabel">演出家</div>
            <div id="revueDirectors"></div>

            <div class="detailLabel">公式サイト</div>
            <div id="revueOfficial"></div>

        </div>

    </section>


    <!-- 主な配役 -->

    <section class="detailSection">

        <h2>主な配役</h2>

        <div id="castTable"></div>

    </section>


    <!-- 出演者 -->

    <section class="detailSection">

        <h2>出演者</h2>

        <div id="castList"></div>

    </section>


    <!-- 階段降り -->

    <section class="detailSection">

        <h2>階段降り</h2>

        <div id="kaidanList"></div>

<script src="./js/revues.js"></script>
