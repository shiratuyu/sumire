<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>プロフィール</title>

<link rel="stylesheet" href="./css/common.css">
<link rel="stylesheet" href="./css/member.css">

</head>

<body>

<header class="top-heading">

    <a href="index.html" class="home-icon">
        <img class="home-img">
    </a>

    <div class="heading-title" id="pageTitle">

    </div>

</header>


<main id="profile">

    <div class="left">

        <!--
        <img id="memberImage">
        -->

        <h1 id="memberName"></h1>

        <div id="memberKana"></div>

        <table class="profileTable">

            <tr>
                <th>期</th>
                <td id="memberGen"></td>
            </tr>

            <tr>
                <th>組</th>
                <td id="memberTrp"></td>
            </tr>

            <tr>
                <th>愛称</th>
                <td id="memberNickname"></td>
            </tr>

            <tr>
                <th>誕生日</th>
                <td id="memberBirthday"></td>
            </tr>

            <tr>
                <th>出身地</th>
                <td id="memberBirthplace"></td>
            </tr>

            <tr>
                <th>身長</th>
                <td id="memberHeight"></td>
            </tr>

        </table>

    </div>


    <div class="right">

        <section>

            <h2>経歴</h2>

            <div id="history"></div>

        </section>


        <section>

            <div class="careerHeading">

                <h2>公演</h2>

                <div class="careerFilter">

                    <button class="careerBtn active" data-mode="all">
                        すべて
                    </button>

                    <button class="careerBtn" data-mode="main">
                        主演等
                    </button>

                </div>

            </div>

            <div id="career"></div>
        </section>

    </div>

</main>


<script src="./js/members.js"></script>
<script src="./js/revues.js"></script>
<script src="./js/member.js"></script>

</body>

</html>
