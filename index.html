<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>宝塚まとめ</title>

  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/index.css">
</head>


<body>

  <header class="top-heading all">
    <div class="heading-title">
      宝塚まとめ
    </div>
  </header>


  <main class="indexMain">

    <form action="search.html" method="get" class="indexSearch">
        <input
            type="search"
            name="q"
            placeholder="生徒・公演・演出家を検索"
            aria-label="サイト内検索"
            required
        >
        <button type="submit">検索</button>
    </form>
    
    <div class="indexMenu">

      <!-- 時系列 -->
      <a href="timeline.html" class="indexCard">

        <div class="indexCardTitle">
          時系列
        </div>

        <div class="indexCardText">
          指定した時点のメンバーを見る
        </div>

      </a>


      <!-- ランキング -->
      <a href="ranking.html" class="indexCard">

        <div class="indexCardTitle">
          ランキング
        </div>

        <div class="indexCardText">
          主演・トップ就任のランキングを見る
        </div>

      </a>


      <!-- 公演一覧 -->
      <a href="revue.html" class="indexCard">

        <div class="indexCardTitle">
          公演一覧
        </div>

        <div class="indexCardText">
          公演情報を見る
        </div>

      </a>

      <!-- 誕生日 -->
      <a href="birthday.html" class="indexCard">

        <div class="indexCardTitle">
          誕生日
        </div>

        <div class="indexCardText">
          誕生日カレンダーを見る
        </div>

      </a>

      <!-- トップ年表 -->
      <a href="top_timeline.html" class="indexCard">

        <div class="indexCardTitle">
          トップ年表
        </div>

        <div class="indexCardText">
          歴代トップスター・トップ娘役の在任期間を見る
        </div>

      </a>

      <!-- 同期一覧 -->
      <a href="generation.html" class="indexCard">
        <div class="indexCardTitle">同期一覧</div>
        <div class="indexCardText">
        期ごとに生徒を一覧表示
        </div>
      </a>

      <a href="director.html" class="indexCard">
        <div class="indexCardTitle">演出家一覧</div>
        <div class="indexCardText">
            演出家ごとの担当作品を調べる
        </div>
      </a>

    </div>

    <!-- 今日の宝塚 -->
    <section id="todaySection">
      <h2>今日の宝塚</h2>
      <div id="todayEvents"></div>
    </section>


  </main>

  <script src="./js/members.js"></script>
  <script src="./js/revues.js"></script>
  <script src="./js/today.js"></script>
</body>

</html>
